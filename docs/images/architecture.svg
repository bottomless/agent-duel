<svg xmlns="http://www.w3.org/2000/svg" width="400" height="312" viewBox="0 0 400 312" role="img" aria-label="Architecture: on your machine, Electron UI, local daemon, local Arena runtime, local repositories and agents. Model calls go through Agent Duel cloud to OpenRouter in the official download, or straight to OpenRouter with your key in a BYOK build.">
  <!-- README architecture diagram, light theme. architecture-dark.svg is its twin: same shapes, different colours. Change both together. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .region { fill: #f6f8fa; stroke: #d1d9e0; }
    .option { fill: none; stroke: #d1d9e0; stroke-dasharray: 5 4; }
    .box { fill: #ffffff; stroke: #d1d9e0; }
    .box.key { stroke: #0969da; stroke-width: 1.5; }
    .label { fill: #59636e; font-size: 11.5px; font-weight: 600; letter-spacing: 1.1px; }
    .label.small { font-size: 10px; }
    .name { fill: #1f2328; font-size: 15px; text-anchor: middle; }
    .sub { fill: #59636e; font-size: 13px; text-anchor: middle; }
    .or { fill: #59636e; font-size: 13px; font-style: italic; text-anchor: middle; }
    .line, .arrow { fill: none; stroke: #818b98; stroke-width: 1.5; stroke-linejoin: round; }
    .arrow { marker-end: url(#head); }
    .head { fill: #818b98; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <!-- Your machine -->
  <rect class="region" x="1" y="1" width="216" height="310" rx="12"/>
  <text class="label" x="19" y="27">YOUR MACHINE</text>

  <rect class="box" x="14" y="44" width="190" height="40" rx="8"/>
  <text class="name" x="109" y="69">Electron UI</text>
  <path class="arrow" d="M109 84V103"/>

  <rect class="box" x="14" y="104" width="190" height="40" rx="8"/>
  <text class="name" x="109" y="129">Local daemon</text>
  <path class="arrow" d="M109 144V163"/>

  <rect class="box key" x="14" y="164" width="190" height="56" rx="8"/>
  <text class="name" x="109" y="187.5">Local Arena</text>
  <text class="name" x="109" y="206.5">runtime</text>
  <path class="arrow" d="M109 220V239"/>

  <rect class="box" x="14" y="240" width="190" height="56" rx="8"/>
  <text class="name" x="109" y="263.5">Local repositories</text>
  <text class="name" x="109" y="282.5">and agents</text>

  <!-- Model calls leave the runtime; a build takes one branch or the other -->
  <path class="line" d="M204 192H226"/>
  <path class="arrow" d="M226 192V57H247"/>
  <path class="arrow" d="M226 192V262H247"/>

  <!-- Official download -->
  <rect class="option" x="236" y="1" width="163" height="152" rx="12"/>
  <text class="label small" x="317" y="26" text-anchor="middle">OFFICIAL DOWNLOAD</text>
  <rect class="box" x="248" y="40" width="140" height="34" rx="8"/>
  <text class="name" x="318" y="62">Agent Duel cloud</text>
  <path class="arrow" d="M318 74V95"/>
  <rect class="box" x="248" y="96" width="140" height="34" rx="8"/>
  <text class="name" x="318" y="118">OpenRouter</text>

  <text class="or" x="317" y="179">or</text>

  <!-- BYOK build -->
  <rect class="option" x="236" y="196" width="163" height="115" rx="12"/>
  <text class="label small" x="317" y="221" text-anchor="middle">BYOK BUILD</text>
  <rect class="box" x="248" y="236" width="140" height="52" rx="8"/>
  <text class="name" x="318" y="257.5">OpenRouter</text>
  <text class="sub" x="318" y="276.5">your key</text>
</svg>
