npmRebuild: false
appId: sh.paseo.desktop
productName: Agent Duel
copyright: "Copyright © 2026 Bottomless"
executableName: Agent Duel
protocols:
  - name: Agent Duel agent link
    schemes:
      - paseo
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!dist/arena/**"
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - dist/native/*.node
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../../LICENSE
    to: licenses/LICENSE
  - from: ../../LICENSE-APACHE
    to: licenses/LICENSE-APACHE
  - from: ../../NOTICE
    to: licenses/NOTICE
  - from: ../../arena-backend/LICENSE
    to: licenses/arena-backend/LICENSE
  - from: dist/arena
    to: arena
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: bottomless
  repo: agent-duel
mac:
  icon: assets/icon.icns
  artifactName: "Agent-Duel-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/paseo
      to: bin/paseo
  target:
    - dmg
    - zip
linux:
  category: Development
  # The desktop entry's Comment and the deb's Description. package.json's description is internal.
  description: "A desktop app for head-to-head coding agent battles, with single-agent mode and free inference."
  # electron-builder renders every hicolor size from this one 512 px PNG, the same artwork as
  # icon.icns and icon.ico.
  icon: assets/icon.png
  # update-alternatives refuses a name with a space, so the deb's install fell back to a plain link
  # that removal left dangling.
  executableName: agent-duel
  # Name the installed desktop entry after desktopName ("Agent Duel.desktop"), as before the rename,
  # not the executable: pinned launchers and the paseo:// handler registration point at that file.
  syncDesktopName: true
  artifactName: "Agent-Duel-${version}-${arch}.${ext}"
  maintainer: "Bottomless"
  vendor: "Bottomless"
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: assets/icon.png
      to: icon.png
  # The two formats the release workflow publishes. rpm and tar.gz still build on request.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
  packageCategory: devel
  # Setting depends replaces electron-builder's default list, so it is written out in full. The
  # default leaves out libgbm1 and libasound2, so the app would not start on a minimal install
  # (Ubuntu 22.04 does not pull libgbm1 in through GTK). Battles need git, and capturing contestant
  # services needs lsof and ps. desktop-file-utils provides update-desktop-database, which the
  # install script runs so GTK and xdg-open find the paseo:// handler.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2
    - git
    - lsof
    - procps
    - desktop-file-utils
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
# The static type-2 runtime runs without libfuse2, which Ubuntu 24.04 does not install. The default
# (legacy) toolset needs it, so the AppImage would not start there.
toolsets:
  appimage: "1.0.3"
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ['"--class=Agent Duel"']
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/paseo CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Agent-Duel-${arch}.${ext}"
win:
  icon: assets/icon.ico
  artifactName: "Agent-Duel-Setup-${version}-${arch}.${ext}"
  extraResources:
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
  # x64 only: build-arena-runtime.mjs compiles the engine and copies watcher.node for the host
  # arch, so an arm64 package built on x64 would ship an x64 engine.
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
# One-click, per-user install in %LOCALAPPDATA%\Programs: no pages and no UAC, so an in-app update
# installs silently. An assisted installer would ask "Anyone / Only for me" again on every update.
nsis:
  oneClick: true
  perMachine: false
