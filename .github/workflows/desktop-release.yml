name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in package.json (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Validate release version and credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import {
            compareReleaseVersions,
            getHighestCanonicalReleaseVersion,
            parseReleaseVersion,
          } from './scripts/release-version-utils.mjs';
          const version = process.env.RELEASE_VERSION;
          parseReleaseVersion(version);
          for (const file of ['package.json', 'packages/desktop/package.json']) {
            if (JSON.parse(fs.readFileSync(file)).version !== version) throw new Error(`Commit the requested version in ${file} first`);
          }
          const tags = execFileSync('git', ['tag', '--list', 'v*'], { encoding: 'utf8' })
            .split(/\r?\n/)
            .filter(Boolean);
          const highestVersion = getHighestCanonicalReleaseVersion(tags);
          if (highestVersion !== null && compareReleaseVersions(version, highestVersion) <= 0) {
            throw new Error(`Release version ${version} must be newer than the highest canonical tag v${highestVersion}`);
          }
          for (const name of ['CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID']) {
            if (!process.env[name]) throw new Error(`Missing release secret: ${name}`);
          }
          JS
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; use a new version.' >&2
            exit 1
          fi

      - name: Install npm dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Install Arena dependencies
        working-directory: arena-backend
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: |
          npm run format:check
          npm run lint

      - name: Add an xcrun wrapper that retries stapler
        run: |
          # stapler fetches the ticket from Apple's CloudKit, and that connection sometimes drops
          # (exit 68, "The network connection was lost"). This xcrun goes first on PATH, so stapler retries
          # that exit both in electron-builder's build step and in the verify step. The staple retry in
          # @electron/notarize 2.5.0 never fires: it rejects without calling promise-retry's retry callback.
          bin="$RUNNER_TEMP/xcrun-retry"
          mkdir -p "$bin"
          cat > "$bin/xcrun" <<'SH'
          #!/bin/bash
          [[ $1 == stapler ]] || exec /usr/bin/xcrun "$@"
          for attempt in 1 2 3; do
            /usr/bin/xcrun "$@" && exit 0
            status=$?
            if [[ $status -ne 68 || $attempt -eq 3 ]]; then exit "$status"; fi
            echo "stapler $2 lost the connection to Apple (attempt $attempt of 3), retrying in $((attempt * 20)) s" >&2
            sleep $((attempt * 20))
          done
          SH
          chmod +x "$bin/xcrun"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Build, sign, and notarize Apple Silicon app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PASEO_WEB_PLATFORM: electron
          # The published release is the update feed, so release builds check it.
          PASEO_DESKTOP_UPDATES_ENABLED: "1"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AGENT_DUEL_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm run build:app-deps:clean
          (cd packages/app && npx expo export --platform web --max-workers 1)
          npm run build --workspace=@getpaseo/desktop -- --publish never --mac --arm64 -c.mac.type=distribution -c.forceCodeSigning=true -c.buildVersion="$AGENT_DUEL_BUILD_NUMBER"

      - name: Typecheck
        run: npm run typecheck

      - name: Verify signing and notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ inputs.version }}
          AGENT_DUEL_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APP='packages/desktop/release/mac-arm64/Agent Duel.app'
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          [[ "$SHORT_VERSION" == "$RELEASE_VERSION" ]] || { echo "CFBundleShortVersionString $SHORT_VERSION does not match $RELEASE_VERSION" >&2; exit 1; }
          [[ "$BUILD_VERSION" == "$AGENT_DUEL_BUILD_NUMBER" ]] || { echo "CFBundleVersion $BUILD_VERSION does not match $AGENT_DUEL_BUILD_NUMBER" >&2; exit 1; }
          codesign --verify --deep --strict "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/signing.txt"
          grep -F 'Authority=Developer ID Application: Bottomless Supply Inc (LGVJP2HNM2)' "$RUNNER_TEMP/signing.txt"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          DMG="packages/desktop/release/Agent-Duel-$RELEASE_VERSION-arm64.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const yaml = require('js-yaml');
          const { executeAppBuilderAsJson } = require('app-builder-lib/out/util/appBuilder');
          (async () => {
            const dir = 'packages/desktop/release';
            const name = `Agent-Duel-${process.env.RELEASE_VERSION}-arm64.dmg`;
            const file = path.join(dir, name);
            const info = await executeAppBuilderAsJson(['blockmap', '--input', file, '--output', `${file}.blockmap`]);
            for (const metadata of fs.readdirSync(dir).filter(name => name.endsWith('-mac.yml'))) {
              const target = path.join(dir, metadata);
              const data = yaml.load(fs.readFileSync(target, 'utf8'));
              const entry = data.files.find(entry => entry.url === name);
              if (!entry) throw new Error(`Missing DMG entry in ${metadata}`);
              entry.sha512 = info.sha512;
              entry.size = info.size;
              fs.writeFileSync(target, yaml.dump(data));
            }
          })().catch(error => { console.error(error); process.exit(1); });
          JS

      - name: Save verified installers
        uses: actions/upload-artifact@v4
        with:
          name: signed-macos-arm64
          if-no-files-found: error
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/*-mac.yml

  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: desktop-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { parseReleaseVersion } from './scripts/release-version-utils.mjs';
          const version = process.env.RELEASE_VERSION;
          parseReleaseVersion(version);
          for (const file of ['package.json', 'packages/desktop/package.json']) {
            if (JSON.parse(fs.readFileSync(file)).version !== version) throw new Error(`Commit the requested version in ${file} first`);
          }
          JS

      - name: Install npm dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Install Arena dependencies
        working-directory: arena-backend
        run: bun install --frozen-lockfile

      # after-pack launches the unpacked app under xvfb-run before electron-builder packages it.
      - name: Install smoke display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - name: Build x64 AppImage and deb
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PASEO_WEB_PLATFORM: electron
          # The published release is the update feed, so release builds check it.
          PASEO_DESKTOP_UPDATES_ENABLED: "1"
          # Same numbering as the macOS build: battles record it as their build provenance.
          AGENT_DUEL_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm run build:app-deps:clean
          (cd packages/app && npx expo export --platform web --max-workers 1)
          npm run build --workspace=@getpaseo/desktop -- --publish never --linux --x64 -c.buildVersion="$AGENT_DUEL_BUILD_NUMBER"

      # The packaged smoke drives the daemon without signing in, which the hosted build refuses
      # ("Sign in to use Agent Duel"), so it runs on a bring-your-own-key package of the same tree,
      # written to its own directory so the release files above stay as built.
      - name: Smoke-test a BYOK package
        working-directory: packages/desktop
        env:
          PASEO_BYOK_BUILD: "1"
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          npm run build:deployment-config
          npx electron-builder --config electron-builder.yml --publish never --linux dir --x64 -c.directories.output=release-smoke

      - name: Save smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-linux-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      # latest-linux.yml carries the AppImage's sha512, so nothing may rebuild the AppImage after it.
      # electron-builder embeds the AppImage's blockmap in the file, so there is no .blockmap to ship.
      - name: Verify update metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node <<'JS'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const yaml = require('js-yaml');
          const dir = 'packages/desktop/release';
          const version = process.env.RELEASE_VERSION;
          const name = 'Agent-Duel-x86_64.AppImage';
          const file = path.join(dir, name);
          const bytes = fs.readFileSync(file);
          const sha512 = crypto.createHash('sha512').update(bytes).digest('base64');
          const latest = yaml.load(fs.readFileSync(path.join(dir, 'latest-linux.yml'), 'utf8'));
          if (latest.version !== version) throw new Error(`latest-linux.yml version ${latest.version} does not match ${version}`);
          const entry = latest.files.find(entry => entry.url === name);
          if (!entry || entry.sha512 !== sha512 || entry.size !== bytes.length) throw new Error(`latest-linux.yml files entry does not match ${name}`);
          if (!fs.existsSync(path.join(dir, `Agent-Duel-${version}-amd64.deb`))) throw new Error('Missing amd64 deb');
          JS

      - name: Save installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/latest-linux.yml

  # One job creates the release from every platform's installers, so no platform races another
  # to create it and a failed platform leaves no half-filled draft.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-macos-arm64
          path: release/macos

      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release/linux

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Not a prerelease, even for betas: the app's default channel updates only to GitHub's
          # latest release, which skips prereleases.
          args=(--draft --target "$GITHUB_SHA" --title "Agent Duel $RELEASE_VERSION" --generate-notes)
          files=(release/macos/*.dmg release/macos/*.zip)
          for file in release/macos/*.blockmap release/macos/*-mac.yml; do
            if [[ -f "$file" ]]; then files+=("$file"); fi
          done
          # Linux reads latest-linux.yml from the same release.
          files+=(
            release/linux/Agent-Duel-x86_64.AppImage
            "release/linux/Agent-Duel-$RELEASE_VERSION-amd64.deb"
            release/linux/latest-linux.yml
          )
          gh release create "v$RELEASE_VERSION" "${args[@]}" "${files[@]}"
