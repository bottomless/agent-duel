npmRebuild: false
appId: sh.paseo.desktop
productName: Agent Duel
executableName: Agent Duel
protocols:
  - name: Agent Duel agent link
    schemes:
      - paseo
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!dist/arena/**"
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - dist/native/*.node
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../../LICENSE
    to: licenses/LICENSE
  - from: ../../LICENSE-APACHE
    to: licenses/LICENSE-APACHE
  - from: ../../NOTICE
    to: licenses/NOTICE
  - from: ../../arena-backend/LICENSE
    to: licenses/arena-backend/LICENSE
  - from: dist/arena
    to: arena
  - from: ../app/dist
    to: app-dist
  - from: ../../skills
    to: skills
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: bottomless
  repo: agent-arena2
mac:
  icon: assets/icon.icns
  artifactName: "Agent-Duel-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/paseo
      to: bin/paseo
  target:
    - dmg
    - zip
linux:
  category: Development
  artifactName: "Agent-Duel-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "Agent Duel"
  extraResources:
    - from: bin/paseo
      to: bin/paseo
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
appImage:
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/paseo CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Agent-Duel-${arch}.${ext}"
win:
  artifactName: "Agent-Duel-Setup-${version}-${arch}.${ext}"
  extraResources:
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
