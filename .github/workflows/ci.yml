name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Typecheck reads the declarations the server-stack build emits.
      - name: Build server stack
        run: npm run build:server

      - name: Typecheck
        run: npm run typecheck

  arena-backend:
    name: arena-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: arena-backend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Include Core because Arena extends its execution hooks.
      - name: Typecheck engine, Core, and arena-service
        run: bun turbo typecheck --filter=opencode --filter=@opencode/core --filter=@agent-duel/arena-service
