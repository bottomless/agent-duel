appId: sh.paseo.debug
---
# A close swipe over the nested workspace list must beat horizontal list intent.
- tapOn:
    id: "menu-button"
- assertVisible:
    id: "sidebar-project-workspace-list-scroll"
- swipe:
    start: "85%,46%"
    end: "10%,46%"
    duration: 300
- assertNotVisible:
    id: "sidebar-project-workspace-list-scroll"
- assertVisible:
    id: "menu-button"
