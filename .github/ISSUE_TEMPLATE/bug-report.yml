name: Bug report
description: Something is broken or doesn't behave the way it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bugs. For feature requests, use the Feature request form; for questions, open a blank issue.

        Before opening, please:

        - search existing issues for the same symptom
        - try to reproduce on the latest version
        - if it's a UI bug, capture a screenshot or short video. text descriptions of UI bugs almost always lose detail.

  - type: textarea
    id: description
    attributes:
      label: What's broken
      description: What happened, and what did you expect to happen instead?
      placeholder: |
        I tried to X, expected Y, got Z.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that triggers the bug. If you can't reproduce on demand, say so.
      placeholder: |
        1. Open the desktop app
        2. Open a local workspace
        3. Click X
        4. ...
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen
      description: The surface you saw the bug on. Pick the closest match.
      options:
        - Desktop macOS (Electron)
        - Browser QA harness
        - CLI
        - Local daemon or Arena runtime
        - Sign-in (official download)
        - Other
    validations:
      required: true

  - type: input
    id: agent-duel-version
    attributes:
      label: Agent Duel version
      description: Settings → About in the app, or the release/build identifier used for testing.
      placeholder: "from Settings → About"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: How you run Agent Duel
      options:
        - Official download (signed in)
        - Source build with your own OpenRouter key (--byok)
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      description: Include the macOS version for desktop issues and the host OS for daemon or CLI issues.
      placeholder: "macOS 15.2"

  - type: dropdown
    id: provider
    attributes:
      label: Agent provider
      description: If the bug involves a specific agent provider, pick which one.
      options:
        - Not relevant
        - Claude Code
        - Codex
        - GitHub Copilot
        - OpenCode
        - Pi
        - Custom provider

  - type: textarea
    id: provider-details
    attributes:
      label: Provider configuration
      description: |
        If the bug involves an agent, what version are you on and what API are you using? Provider behavior changes a lot across versions and API backends.

        Issues are public. Remove API keys, tokens and private code before pasting.
      placeholder: |
        Claude Code v1.2.3 with Anthropic API
        Codex CLI v0.5.0 with OpenAI API
        OpenCode v0.3.1
        (or paste the relevant section of ~/.paseo/config.json for custom providers)

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste relevant log output. Strongly preferred for crashes and daemon issues.

        Issues are public. Remove API keys, tokens and private code before pasting.

        - **Daemon log:** `~/.paseo/daemon.log` for the official download, `.dev/paseo-home/daemon.log` in your checkout for source builds (override with `$PASEO_HOME`)
        - **Electron log (macOS):** `~/Library/Logs/Agent Duel/main.log`
        - **Electron log (Windows):** `%APPDATA%\Agent Duel\logs\main.log`
        - **Electron log (Linux):** `~/.config/Agent Duel/logs/main.log`

        Paste the **full log around the time of the bug**, not a summary. If you used an AI to investigate, paste the raw log it read, not the AI's interpretation. AI summaries lose the detail needed to fix the bug.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: |
        **Required for UI bugs.** Drag and drop directly into this field. Short videos beat screenshots for anything involving interaction or animation.

  - type: markdown
    attributes:
      value: |
        ---

        **A note on AI-assisted reports.** Using an agent to gather information (logs, repro steps, version checks) is fine and useful. Using an agent to *diagnose* the bug and then submitting only that diagnosis is not. Agents routinely correlate adjacent log lines as cause-and-effect when they aren't related, and a report filtered through an AI summary loses the detail needed to fix the bug. Paste the raw inputs.
